# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: trailbaseio
    repo_name: trailbase
    description: An open, sub-millisecond, single-executable Firebase alternative with type-safe APIs, built-in WebAssembly runtime, realtime subscriptions, auth, MCP and admin UI built on Rust, SQLite (PG) & Wasmtime
    files:
      - name: trail
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.22.2"
        url: https://gh-proxy.org/https://github.com/trailbaseio/trailbase/releases/download/{{.Version}}/{{.Asset}}
        asset: trailbase_{{.Version}}_{{.Arch}}_{{.OS}}.{{.Format}}
        format: zip
        replacements:
          amd64: x86_64
        overrides:
          - goos: darwin
            asset: trailbase_{{.Version}}_{{.Arch}}_apple_{{.OS}}.{{.Format}}
        supported_envs:
          - linux
          - darwin
      - version_constraint: Version == "v0.25.3"
        url: https://gh-proxy.org/https://github.com/trailbaseio/trailbase/releases/download/{{.Version}}/{{.Asset}}
        asset: trailbase_{{.Version}}_{{.Arch}}_{{.OS}}.{{.Format}}
        format: zip
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
        supported_envs:
          - linux
          - windows/amd64
      - version_constraint: semver("<= 0.3.2")
        url: https://gh-proxy.org/https://github.com/trailbaseio/trailbase/releases/download/{{.Version}}/{{.Asset}}
        asset: trailbase_{{.Version}}_{{.Arch}}_{{.OS}}.{{.Format}}
        format: zip
        replacements:
          amd64: x86_64
        overrides:
          - goos: darwin
            asset: trailbase_{{.Version}}_{{.Arch}}_apple_{{.OS}}.{{.Format}}
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 0.21.10")
        url: https://gh-proxy.org/https://github.com/trailbaseio/trailbase/releases/download/{{.Version}}/{{.Asset}}
        asset: trailbase_{{.Version}}_{{.Arch}}_{{.OS}}.{{.Format}}
        format: zip
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
        overrides:
          - goos: darwin
            asset: trailbase_{{.Version}}_{{.Arch}}_apple_{{.OS}}.{{.Format}}
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: "true"
        url: https://gh-proxy.org/https://github.com/trailbaseio/trailbase/releases/download/{{.Version}}/{{.Asset}}
        asset: trailbase_{{.Version}}_{{.Arch}}_{{.OS}}.{{.Format}}
        format: zip
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
        overrides:
          - goos: darwin
            asset: trailbase_{{.Version}}_{{.Arch}}_apple_{{.OS}}.{{.Format}}
